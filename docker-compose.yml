services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: orbitalx, POSTGRES_PASSWORD: orbitalx, POSTGRES_DB: orbitalx }
    volumes: [ "pgdata:/var/lib/postgresql/data", "./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" ]
  app:
    build: .
    depends_on: [ db ]
    environment:
      DATABASE_URL: postgresql+psycopg://orbitalx:orbitalx@db:5432/orbitalx
      DATA_DIR: /app/data
    volumes: [ "./data:/app/data" ]
    ports: [ "8000:8000" ]
volumes: { pgdata: {} }
